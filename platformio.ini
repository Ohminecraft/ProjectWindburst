; Windburst Reworked.
;   rx_esp32_s3: the flight controller (src/main.cpp). Compiled with the real ESP32-S3 toolchain in the authoring sandbox; NEVER run on hardware there.
;   tx_c5 : placeholder only (prints a message) - the transmitter firmware is not written yet and this env was never compiled.
; PC verification: `make test` (firmware logic incl. firmware-in-the-loop), `make sim` + `make apptest` (app <-> firmware). See docs/FIRMWARE.md.
[platformio]
default_envs = rx_esp32_s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; deep: also follow #include inside headers (Wire.h / SPI.h / SD.h are only included from src/**/*.h).
; NOT "deep+": that mode evaluates #if around includes without knowing the chip's SOC_* macros, and then builds the bundled
; SD_MMC library without its FS dependency ("FS.h: No such file").
lib_ldf_mode = deep
; UART0 / USB-serial bridge speed of the app link (WB_LINK_BAUD in src/main.cpp). The link is BINARY (WBP): use `python -m wbclient`
; (app/), not the serial monitor. For the ESP32-S3's own USB socket use the rx_s3_usb environment below.
monitor_speed = 230400
; test/ holds PC-only tests (run with `make test`); keep PlatformIO from trying to build them for the ESP32
test_ignore = *
build_flags = -O2 -Wall -Wno-unused-variable -Wno-unused-function

; ---------------------------------------------------------------------------------------------------------------------------
; The flight controller. Pick the environment that matches the ESP32-S3 MODULE on your board (the letters printed on its shield):
;   rx_s3      N16R8  = 16 MB flash + 8 MB octal PSRAM   (default)      GPIO35..37 belong to the PSRAM and cannot be used
;   rx_s3_n8   N8     =  8 MB flash, no PSRAM
; A wrong choice does not damage anything: the firmware does not start (wrong flash size / PSRAM type) until the right one is flashed.
; ---------------------------------------------------------------------------------------------------------------------------
[esp32_common]
; -mtext-section-literals: required on Xtensa (S3) for IRAM_ATTR interrupt callbacks defined in headers (RMT DShot telemetry)
; Arduino's serial event task (the receiver's UART error counts) runs on core 0 at a low priority - its default is the highest
; priority there is, on any core, which would cut into the control cycle on core 1
build_flags = ${env.build_flags} -D_WINDBURST_RX -mtext-section-literals -DARDUINO_SERIAL_EVENT_TASK_PRIORITY=2 -DARDUINO_SERIAL_EVENT_TASK_RUNNING_CORE=0
; The code of the control cycle is placed in internal RAM (WB_FAST, src/config/fast_code.h; about 30 kB). To compare on the
; board, build once with   -DWB_FAST_CODE=0   added to the line above and look at the time per stage in the status tab.
; What ended up in RAM, and what the cycle still calls in flash:   python3 tools/iram_report.py .pio/build/rx_s3/firmware.elf
; Pololu VL53 libraries (MIT) for the sonar/lidar. REQUIRED: without lib_deps PlatformIO never adds them and the sonar driver silently compiles to 'library missing'.
lib_deps =
    pololu/VL53L0X@^1.3.1
    pololu/VL53L1X@^1.3.1

; The same board, the app link on the chip's own USB socket with the USB stack run by the firmware (TinyUSB): the board shows up
; under its own name (general.usb_name, default "Windburst ESP32-S3"; the app: tab System). Costs the JTAG debug port of the
; built-in USB Serial/JTAG. Flashing: PlatformIO restarts the chip into its bootloader with a "1200 baud touch" and waits for the
; bootloader's port; if that fails, hold BOOT while plugging in. DTR / RTS never restart the chip (ESC tools toggle them).
[env:rx_esp32_s3]
board = esp32-s3-devkitc1-n16r8
build_flags = ${esp32_common.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_USB_MODE=0 -DWB_USB_OTG=1
lib_deps = ${esp32_common.lib_deps}
board_build.partitions = partitions/wblog_16MB.csv
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; ---------------------------------------------------------------------------------------------------------------------------
; The plain ESP32 (ESP32-D0WD, the "ESP32 DevKit" / WROOM-32 boards): no native USB (the app link is UART0 through the board's
; USB-serial bridge, 230400 baud), GPIO 0 .. 39 (34 .. 39 input only; 6 .. 11 are the flash), 8 RMT channels.
[env:rx_esp32]
board = esp32dev
build_flags = ${esp32_common.build_flags} -DWB_FAST_CODE=0 -Wl,-Map=.pio/build/rx_esp32/fw.map
lib_deps = ${esp32_common.lib_deps}
board_build.partitions = partitions/wblog_4MB.csv

; ---------------------------------------------------------------------------------------------------------------------------
; STM32 (docs/STM32.md). One environment per chip; the board files of the ones PlatformIO has no generic board for are in
; boards/. The app link is the chip's own USB (CDC). Pins are named PA0 .. PK15; the app offers only the pins of the chip's
; package (the device info carries them). NOT tried on hardware. Not yet on STM32: DShot, the SD card, ESC telemetry.
; Needs the STM32 platform with STM32duino 4.x (H5 / C5 support): the GitHub platform below brings it.
[stm32_common]
platform = https://github.com/platformio/platform-ststm32.git
build_flags = ${env.build_flags} -D_WINDBURST_RX -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC -DUSBCON -DSERIAL_RX_BUFFER_SIZE=1024 -DSERIAL_TX_BUFFER_SIZE=256
lib_deps =
    pololu/VL53L0X@^1.3.1
    pololu/VL53L1X@^1.3.1
    stm32duino/STM32duino FreeRTOS@^10.3.2
upload_protocol = stlink

; STM32H5: settings and the flight log in flash bank 2 (the firmware runs from bank 1, both work at the same time)
[env:rx_h563]
extends = stm32_common
board = nucleo_h563zi
[env:rx_h562]
extends = stm32_common
board = wb_h562rgt
[env:rx_h523]
extends = stm32_common
board = wb_h523cet
; (STM32duino compiles the delay-block driver for every H5; on the H523's generic variant it only builds with the SD module on)
build_flags = ${stm32_common.build_flags} -DHAL_SD_MODULE_ENABLED
; (the generic H523 variant has no linker script of its own: ST's template for the chip)
board_build.ldscript = ${platformio.packages_dir}/framework-arduinoststm32/system/Drivers/CMSIS/Device/ST/STM32H5xx/Source/Templates/gcc/linker/STM32H523xx_FLASH.ld

; STM32G4: G473 (dual bank: settings + log in bank 2), G491 (one bank: settings only, no flight log in the chip's flash),
; G431 (128 kB flash, 32 kB RAM: the firmware does not fit - the environment is there to say so)
[env:rx_g473]
extends = stm32_common
board = wb_g473ceu
[env:rx_g491]
extends = stm32_common
board = wb_g491ret
[env:rx_g431]
extends = stm32_common
board = genericSTM32G431CB

; STM32F4: one bank of 16 / 64 / 128 kB sectors: settings in the last two sectors, no flight log in the chip's flash
[env:rx_f405]
extends = stm32_common
board = genericSTM32F405RG
[env:rx_f412]
extends = stm32_common
board = genericSTM32F412RG

; STM32C5: dual bank (settings + log in bank 2). STM32duino's USB device library does not work with the C5's new HAL (HAL2)
; yet: the app link is the variant's default UART (Serial: USART1 / LPUART, 230400 baud) through a USB-UART bridge.
[env:rx_c552]
extends = stm32_common
board = wb_c552cet
build_flags = ${env.build_flags} -D_WINDBURST_RX -DSERIAL_RX_BUFFER_SIZE=1024 -DSERIAL_TX_BUFFER_SIZE=256

[env:tx_c5]
board = esp32-c5-devkitc1-n8r4
build_flags = ${env.build_flags} -D_WINDBURST_TX
