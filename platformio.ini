; Windburst Reworked.
;   rx_s3 / rx_s3_usb / rx_s3_n8 : the flight controller (src/main.cpp). Compiled with the real ESP32-S3 toolchain in the authoring sandbox; NEVER run on hardware there.
;   tx_c5 : placeholder only (prints a message) - the transmitter firmware is not written yet and this env was never compiled.
; PC verification: `make test` (firmware logic incl. firmware-in-the-loop), `make sim` + `make apptest` (app <-> firmware). See docs/FIRMWARE.md.
[platformio]
default_envs = rx_s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; deep: also follow #include inside headers (Wire.h / SPI.h / SD.h are only included from src/**/*.h).
; NOT "deep+": that mode evaluates #if around includes without knowing the chip's SOC_* macros, and then builds the bundled
; SD_MMC library without its FS dependency ("FS.h: No such file").
lib_ldf_mode = deep
; UART0 / USB-serial bridge speed of the app link (WB_LINK_BAUD in src/main.cpp). The link is BINARY (WBP): use `python -m wbclient`
; (app/), not the serial monitor. For the ESP32-S3's own USB socket use the rx_s3_usb environment below.
monitor_speed = 230400
; test/ holds PC-only tests (run with `make test`); keep PlatformIO from trying to build them for the ESP32
test_ignore = *
build_flags = -O2 -Wall -Wno-unused-variable -Wno-unused-function

; ---------------------------------------------------------------------------------------------------------------------------
; The flight controller. Pick the environment that matches the ESP32-S3 MODULE on your board (the letters printed on its shield):
;   rx_s3      N16R8  = 16 MB flash + 8 MB octal PSRAM   (default)      GPIO35..37 belong to the PSRAM and cannot be used
;   rx_s3_n8   N8     =  8 MB flash, no PSRAM
; A wrong choice does not damage anything: the firmware does not start (wrong flash size / PSRAM type) until the right one is flashed.
; ---------------------------------------------------------------------------------------------------------------------------
[rx_common]
; -mtext-section-literals: required on Xtensa (S3) for IRAM_ATTR interrupt callbacks defined in headers (RMT DShot telemetry)
build_flags = ${env.build_flags} -D_WINDBURST_RX -mtext-section-literals
; The code of the control cycle is placed in internal RAM (WB_FAST, src/config/fast_code.h; about 30 kB). To compare on the
; board, build once with   -DWB_FAST_CODE=0   added to the line above and look at the time per stage in the status tab.
; What ended up in RAM, and what the cycle still calls in flash:   python3 tools/iram_report.py .pio/build/rx_s3/firmware.elf
; Pololu VL53 libraries (MIT) for the sonar/lidar. REQUIRED: without lib_deps PlatformIO never adds them and the sonar driver silently compiles to 'library missing'.
lib_deps =
    pololu/VL53L0X@^1.3.1
    pololu/VL53L1X@^1.3.1

[env:rx_s3]
board = esp32-s3-devkitc1-n16r8
build_flags = ${rx_common.build_flags}
lib_deps = ${rx_common.lib_deps}
; Flight log (blackbox) in the on-board flash: one 2 MB application slot, the remaining 14 MB are the log ("wblog", used raw).
; Flashing a different table moves / wipes the log partition; settings (NVS) keep their place.
board_build.partitions = partitions/wblog_16MB.csv
; The PSRAM is used for the SD card's write buffer only (512 kB); the flight loop never touches it.

; The same board with the app link on the ESP32-S3's OWN USB socket (GPIO19 / 20) instead of UART0: much faster than a 230400
; baud bridge (live log at full rate, quick log downloads).
;   ARDUINO_USB_MODE=1  USB Serial/JTAG (the chip's built-in USB serial; this is the one that was tried on a board)
;   ARDUINO_USB_MODE=0  native USB CDC (TinyUSB) also compiles and is supported by the link code, but has not been tried
[env:rx_s3_usb]
board = esp32-s3-devkitc1-n16r8
build_flags = ${rx_common.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
lib_deps = ${rx_common.lib_deps}
board_build.partitions = partitions/wblog_16MB.csv

[env:rx_s3_n8]
board = esp32-s3-devkitc-1
build_flags = ${rx_common.build_flags}
lib_deps = ${rx_common.lib_deps}
; By default the stock "spiffs" partition of the board's table is the log (about 1.5 MB). For a bigger one:
;   board_build.partitions = partitions/wblog_8MB.csv        ; or wblog_4MB.csv for a 4 MB module

[env:tx_c5]
board = esp32-c5-devkitc1-n8r4
build_flags = ${env.build_flags} -D_WINDBURST_TX
